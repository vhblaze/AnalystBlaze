name: Security Pentest

on:
  push:
    branches: [main]

jobs:
  desktop-security:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run desktop security harness
        run: cargo test --test security_harness
      - name: Run adaptive optimizer regressions
        run: cargo test optimizations::
